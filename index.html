<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Root Chase</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 50px;
    }

    .player-name {
      font-size: 22px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 30px;
    }

    .runs {
      font-size: 64px;
      font-weight: bold;
      margin: 10px 0;
    }

    .label {
      color: #aaa;
      margin-bottom: 30px;
    }

    .remaining {
      font-size: 90px;
      font-weight: bold;
      margin: 30px 0 5px;
    }

    .remaining-label {
      font-size: 20px;
      margin-bottom: 50px;
    }

    .progress-container {
      width: 100%;
      height: 18px;
      background: #333;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 40px;
    }

    .progress-bar {
      height: 100%;
      background: white;
      width: 0%;
    }

    .progress-text {
      margin-top: 12px;
      color: #aaa;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>THE ROOT CHASE</h1>

    <div class="subtitle">
      Joe Root's pursuit of Test cricket history
    </div>


    <div class="player-name">
      Joe Root
    </div>

    <div class="runs" id="rootRuns">
      0
    </div>

    <div class="label">
      Test runs
    </div>


    <div class="remaining" id="runsRemaining">
      0
    </div>

    <div class="remaining-label">
      runs needed to break the record
    </div>


    <div class="player-name">
      Sachin Tendulkar
    </div>

    <div class="runs">
      15,921
    </div>

    <div class="label">
      Test runs
    </div>


    <div class="progress-container">

      <div
        class="progress-bar"
        id="progressBar">
      </div>

    </div>

    <div
      class="progress-text"
      id="progressText">
    </div>

  </div>


  <script>

  const recordToBreak = 15922;

  async function loadRootRuns() {

    const response = await fetch(
      "https://root-chase-data.aaafhma.workers.dev"
    );

    const data = await response.json();

    const rootRuns = data.rootRuns;

    const runsRemaining =
      recordToBreak - rootRuns;

    const progress =
      (rootRuns / recordToBreak) * 100;


    document.getElementById("rootRuns").textContent =
      rootRuns.toLocaleString();


    document.getElementById("runsRemaining").textContent =
      runsRemaining.toLocaleString();


    document.getElementById("progressBar").style.width =
      progress + "%";


    document.getElementById("progressText").textContent =
      progress.toFixed(1) + "% complete";
  }


  loadRootRuns();
  setInterval(loadRootRuns, 300000);

</script>

</body>

</html>
